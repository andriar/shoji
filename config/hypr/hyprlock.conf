# Shoji lock screen — colors and fonts from theme.conf, ensō rendered by `shoji apply`
source = ~/.config/hypr/theme.conf

general {
    hide_cursor = true
}

background {
    # current wallpaper, kept in sync by hypr-wall
    path = ~/.cache/hypr-wall/lock.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# the ensō, time inside it
image {
    path = ~/.cache/shoji/lock-enso.png
    size = 320
    rounding = 0
    border_size = 0
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = $TIME
    color = $text
    font_size = 60
    font_family = $font_display Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] ~/.local/bin/shoji date-kanji
    color = $muted
    font_size = 15
    font_family = $font_display
    position = 0, 78
    halign = center
    valign = center
}

# seal in the ensō's lower right: the only accent on screen = "locked"
shape {
    size = 30, 30
    color = $accent
    rounding = 5
    border_size = 0
    position = 98, 20
    halign = center
    valign = center
}

label {
    text = 錠
    color = $on_accent
    font_size = 14
    font_family = $font_display Bold
    position = 98, 21
    halign = center
    valign = center
}

input-field {
    size = 300, 46
    outline_thickness = 1
    outer_color = $edge
    inner_color = $glass
    font_color = $text
    check_color = $muted
    fail_color = $alert
    placeholder_text = Password · $USER
    capslock_color = $warn
    fade_on_empty = false
    font_family = $font_ui
    fail_text = Wrong password — check Caps Lock ($ATTEMPTS)
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.4
    position = 0, -110
    halign = center
    valign = center
}

# battery, laptops only (prints nothing without one)
label {
    text = cmd[update:30000] b=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -1); [ -n "$b" ] && echo "$(cat $b/capacity)% · $(cat $b/status | tr A-Z a-z)"
    color = $muted
    font_size = 11
    font_family = $font_ui
    position = 0, 30
    halign = center
    valign = bottom
}
