# Shoji launcher — colors + icon theme from colors.ini (generated by shoji)
[main]
font=Zen Kaku Gothic New:size=11,lucide:size=11,JetBrainsMono Nerd Font:size=11
terminal=ghostty -e
prompt="  "
placeholder=Search apps
width=40
lines=8
horizontal-pad=14
vertical-pad=10
inner-pad=6
line-height=26
layer=overlay
include=@HOME@/.config/fuzzel/colors.ini

[border]
width=1
radius=14
