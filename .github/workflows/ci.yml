name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (GTK 3, layer shell, cairo, a virtual display)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            gir1.2-gtklayershell-0.1 gir1.2-edataserver-1.2 xvfb
      - name: Syntax of every script
        run: |
          for f in bin/* bootstrap.sh install.sh uninstall.sh; do
            case "$(head -1 "$f")" in
              *python*) python3 -m py_compile "$f" ;;
              *sh*) bash -n "$f" ;;
            esac
          done
          python3 -m py_compile generators/*.py widgets/shoji_widgets/*.py tests/*.py
      - name: Install the scripts the widgets load (shoji, audio-switch) and Lucide's glyph map
        run: |
          mkdir -p ~/.local/bin ~/.local/share/fonts/Shoji
          for f in bin/*; do if [ -f "$f" ]; then install -m 755 "$f" ~/.local/bin/; fi; done
          curl -fsSL -o ~/.local/share/fonts/Shoji/lucide-info.json \
            https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/font/info.json
      - name: Logic tests
        run: xvfb-run -a python3 -m unittest discover -v tests
