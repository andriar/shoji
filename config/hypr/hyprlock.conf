# Shoji lock screen — colors and fonts from theme.conf, ensō rendered by `shoji apply`
source = ~/.config/hypr/theme.conf

general {
    hide_cursor = true
}

background {
    # the wallpaper without its sun or moon (shoji); any other wallpaper as it is
    path = ~/.cache/shoji/lock.png
    blur_passes = 0
    brightness = 0.8
}

# the ensō, time inside it, where the moon was ($lock_* from theme.conf: the golden spiral's eye)
image {
    path = ~/.cache/shoji/lock-enso.png
    size = 320
    rounding = 0
    border_size = 0
    position = $lock_enso
    halign = center
    valign = center
}

label {
    text = $TIME
    color = $text
    font_size = 60
    font_family = $font_display Bold
    position = $lock_time
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] ~/.local/bin/shoji date-kanji
    color = $muted
    font_size = 15
    font_family = $font_display
    position = $lock_date
    halign = center
    valign = center
}

# seal in the ensō's lower right: the only accent on screen = "locked"
shape {
    size = 30, 30
    color = $accent
    rounding = 5
    border_size = 0
    position = $lock_seal
    halign = center
    valign = center
}

label {
    text = 錠
    color = $on_accent
    font_size = 14
    font_family = $font_display Bold
    position = $lock_seal_text
    halign = center
    valign = center
}

input-field {
    size = 300, 46
    outline_thickness = 1
    outer_color = $edge
    inner_color = $glass
    font_color = $text
    check_color = $muted
    fail_color = $alert
    placeholder_text = Password · $USER
    capslock_color = $warn
    fade_on_empty = false
    font_family = $font_ui
    fail_text = Wrong password — check Caps Lock ($ATTEMPTS)
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.4
    position = $lock_input
    halign = center
    valign = center
}

# battery, laptops only (prints nothing without one)
label {
    text = cmd[update:30000] b=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -1); [ -n "$b" ] && echo "$(cat $b/capacity)% · $(cat $b/status | tr A-Z a-z)"
    color = $muted
    font_size = 11
    font_family = $font_ui
    position = 0, 30
    halign = center
    valign = bottom
}
