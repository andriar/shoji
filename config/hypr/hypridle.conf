# Shoji's idle steps for hypridle (~/.config/hypr/hypridle.conf):
# 8 min the ink screen (墨), 10 min the lock, 15 min the screen off. Any input before the lock
# brings the desktop back. `"ink": false` in ~/.config/shoji/prefs.json skips the ink screen.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 480
    on-timeout = ~/.local/bin/shoji-ink start
    on-resume = ~/.local/bin/shoji-ink stop
}

listener {
    timeout = 600
    on-timeout = ~/.local/bin/shoji-ink stop; loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
